name: CI

on:
  push:
  pull_request:

jobs:
  test-install:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.6.15', '3.8.18', '3.9.25', '3.10.21', '3.11.16', '3.12.14', '3.13.15', '3.14.7']
        os: [ubuntu-latest]
        include:
          - python-version: '3.6.15'
            os: ubuntu-20.04
        exclude:
          - python-version: '3.6.15'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .
